[package]
name = "atomadb"
version = "0.1.0"
edition = "2021"
description = "AtomaDB — Apple-native multimodal index engine (Spec 17), Stage-2 probe build"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
sha2 = "0.10"

[profile.release]
opt-level = 3
